name: internet-shop

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: opencart
      MARIADB_USER: opencart
      MARIADB_PASSWORD: ${SHOP_DB_PASSWORD:-opencart}
      MARIADB_ROOT_PASSWORD: ${SHOP_DB_PASSWORD:-opencart}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  shop:
    build: ./shop
    depends_on:
      db:
        condition: service_healthy
    environment:
      SHOP_PORT: ${SHOP_PORT:-8080}
      SHOP_DB_PASSWORD: ${SHOP_DB_PASSWORD:-opencart}
      SHOP_ADMIN_USER: ${SHOP_ADMIN_USER:-admin}
      SHOP_ADMIN_PASSWORD: ${SHOP_ADMIN_PASSWORD:-admin}
      SHOP_ADMIN_EMAIL: ${SHOP_ADMIN_EMAIL:-admin@example.com}
      SHOP_API_KEY: ${SHOP_API_KEY:-local-demo-api-key-change-me}
    ports:
      - "${SHOP_PORT:-8080}:80"
    volumes:
      - shop-state:/state
      - shop-images:/var/www/html/image/catalog
    healthcheck:
      test: ["CMD-SHELL", "test -f /state/ready && curl -fsS -o /dev/null http://localhost/index.php?route=common/home"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 20s

  loader:
    build:
      context: .
      dockerfile: src/ShopLoader/Dockerfile
    depends_on:
      shop:
        condition: service_healthy
    environment:
      SHOP_API_KEY: ${SHOP_API_KEY:-local-demo-api-key-change-me}
    command: ["--file", "/data/sample-catalog.json", "--images-dir", "/data/images", "--url", "http://shop"]
    restart: "no"

volumes:
  db-data:
  shop-state:
  shop-images:
