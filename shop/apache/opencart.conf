# Pretty URLs for the catalog API extension: /catalog-api/<path> is routed to the extension controller.
<Directory /var/www/html>
    AllowOverride None
    RewriteEngine On
    # Pass the Authorization header through to PHP.
    RewriteCond %{HTTP:Authorization} ^(.+)$
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
    RewriteRule ^catalog-api/(.*)$ index.php?route=catalog_api/api&api_path=$1 [QSA,L]
</Directory>
PassEnv SHOP_API_KEY
