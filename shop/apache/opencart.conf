# Pretty URLs for the catalog API extension: /catalog-api/<path> is routed to the extension controller (extension/ai_assistant/api).
<Directory /var/www/html>
    AllowOverride None
    RewriteEngine On
    # Pass the Authorization header through to PHP.
    RewriteCond %{HTTP:Authorization} ^(.+)$
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
    RewriteRule ^catalog-api/(.*)$ index.php?route=extension/ai_assistant/api&api_path=$1 [QSA,L]
</Directory>
# OpenCart keeps logs, sessions, uploads and cache under system/storage, inside the web root, and relies on
# .htaccess (switched off above) to hide them. Nothing there is meant to be served.
<Directory /var/www/html/system/storage>
    Require all denied
</Directory>
PassEnv SHOP_API_KEY
