name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Runs the whole automated suite (unit, integration and AI evaluation tests).
      # Until the first feature adds a solution there is nothing to test; the job still
      # passes so it can be required on every PR from the start.
      - name: Run tests
        run: |
          if ls ./*.sln ./*.slnx >/dev/null 2>&1; then
            dotnet test --configuration Release
          else
            echo "No solution found yet, skipping tests."
          fi
