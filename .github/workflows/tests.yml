name: Tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Unit tests
        run: dotnet test tests/ShopLoader.UnitTests --configuration Release --no-build

      # Starts real OpenCart and MariaDB containers with Testcontainers and runs the loader against them.
      - name: Integration tests
        run: dotnet test tests/ShopLoader.IntegrationTests --configuration Release --no-build

      # The Native AOT loader is built inside the loader image; this runs the demo exactly as a reader would.
      - name: Demo stack smoke test (docker compose up -d)
        run: tools/smoke-test.sh
