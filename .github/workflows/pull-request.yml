name: Pull request

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  # `tests` is a required check, so the workflow always runs. A change that only touches documentation or
  # editor settings skips the expensive job below; a skipped job counts as passing for required checks.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Without a usable base (first push of a branch), assume code changed.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qvE '^(specs/|\.specify/|\.vscode/|\.claude/|tools/fetch-opencart-source\.sh$|\.gitignore$|LICENSE$)|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Format check
        run: dotnet format InternetShop.slnx --verify-no-changes --no-restore

      # Syntax check of the OpenCart extension's PHP on the PHP version the shop image runs; no OpenCart sources needed.
      - name: PHP syntax check
        run: tools/lint-php.sh

      - name: Unit tests
        run: dotnet test tests/ShopLoader.UnitTests --configuration Release --no-build

      # Starts real OpenCart and MariaDB containers with Testcontainers and runs the loader against them.
      - name: Integration tests
        run: dotnet test tests/ShopLoader.IntegrationTests --configuration Release --no-build

      # The Native AOT loader is built inside the loader image; this runs the demo exactly as a reader would.
      - name: Demo stack smoke test (docker compose up -d)
        run: tools/smoke-test.sh
