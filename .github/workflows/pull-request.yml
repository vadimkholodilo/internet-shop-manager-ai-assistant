name: Pull request

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

env:
  # The files the Docker linters care about (tools/check-changed.sh classifies the same names): used to decide whether to
  # lint and to pick what to lint. The config files are not linted themselves but change the result.
  DOCKER_FILES: '(^|/)(Dockerfile(\..+)?|[^/]+\.dockerfile|docker-compose[^/]*\.ya?ml|compose\.ya?ml)$'
  DOCKER_LINT_CONFIG: '^(\.hadolint\.yaml|\.trivyignore\.yaml|\.dockerignore)$'

jobs:
  # `tests` is a required check, so the workflow always runs. A change that only touches documentation or
  # editor settings skips the expensive job below; a skipped job counts as passing for required checks.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      docker: ${{ steps.diff.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Without a usable base (first push of a branch), assume code and Docker files changed.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE" HEAD)"
          if printf '%s\n' "$changed" | grep -vE '^(specs/|\.specify/|\.vscode/|\.claude/|tools/fetch-opencart-source\.sh$|\.gitignore$|LICENSE$)|\.md$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$changed" | grep -qE "$DOCKER_FILES|$DOCKER_LINT_CONFIG"; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Format check
        run: dotnet format InternetShop.slnx --verify-no-changes --no-restore

      # Syntax check of the OpenCart extension's PHP on the PHP version the shop image runs; no OpenCart sources needed.
      - name: PHP syntax check
        run: tools/lint-php.sh

      # Only when a Dockerfile, a compose file or the linter configuration changed. The linters are downloaded at a
      # pinned version and checked against a checksum, so a changed release fails the step.
      - name: Install Docker linters
        if: needs.changes.outputs.docker == 'true'
        env:
          HADOLINT_VERSION: v2.15.1
          HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
          TRIVY_VERSION: 0.76.2
          TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
        run: |
          curl -fsSL -o hadolint "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum -c -
          sudo install hadolint /usr/local/bin/hadolint

          curl -fsSL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          sudo install trivy /usr/local/bin/trivy

      # The same checks as the pre-commit hook, on every Dockerfile and compose file in the repository.
      - name: Docker lint
        if: needs.changes.outputs.docker == 'true'
        run: git ls-files | grep -E "$DOCKER_FILES" | tools/check-changed.sh

      - name: Unit tests
        run: dotnet test tests/ShopLoader.UnitTests --configuration Release --no-build

      - name: Shop client unit tests
        run: dotnet test tests/ShopClient.UnitTests --configuration Release --no-build

      # Starts real OpenCart and MariaDB containers with Testcontainers and runs the loader against them.
      - name: Integration tests
        run: dotnet test tests/ShopLoader.IntegrationTests --configuration Release --no-build

      # The Native AOT loader is built inside the loader image; this runs the demo exactly as a reader would.
      - name: Demo stack smoke test (docker compose up -d)
        run: tools/smoke-test.sh
